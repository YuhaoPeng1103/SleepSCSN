[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepcp"
version = "0.1.0"
description = "Patient-level conformal prediction sets for automatic sleep staging"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.7", "seaborn>=0.13", "mne>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
